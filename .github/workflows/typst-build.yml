name: Build Typst PDF

on:
  push:
    branches: [ "main", "feature/**" ]
    paths:
      - "**/*.typ"
  pull_request:
    paths:
      - "**/*.typ"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Typst
        run: |
          TYPST_VERSION=0.12.0
          curl -sL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-gnu.tar.xz" -o typst.tar.xz
          mkdir typst-bin
          tar -xf typst.tar.xz -C typst-bin --strip-components=1
          echo "$PWD/typst-bin" >> $GITHUB_PATH

      - name: Build PDF
        run: |
          mkdir -p build
          typst compile main.typ build/document.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: typst-document
          path: build/document.pdf