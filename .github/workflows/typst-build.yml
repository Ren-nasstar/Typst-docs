name: Build Typst PDF

on:
  push:
    branches: [ "main", "feature/**" ]
    paths:
      - "**.typ"
  pull_request:
    paths:
      - "**.typ"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install Rust toolchain (required for cargo)
      - name: Install Rust (for typst-cli)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Install the Typst CLI from crates.io
      - name: Install Typst CLI
        run: cargo install typst-cli

      - name: Build PDF
        run: |
          mkdir -p build
          # adjust path to main.typ if it lives in a subfolder
          typst compile main.typ build/document.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: typst-document
          path: build/document.pdf